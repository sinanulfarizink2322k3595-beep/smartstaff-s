<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)"/>
  
  <!-- Graduation cap icon -->
  <g transform="translate(50, 60)">
    <!-- Cap top -->
    <polygon points="50,20 10,35 50,50 90,35" fill="white"/>
    
    <!-- Cap board -->
    <path d="M 20 35 L 20 55 Q 35 65 50 65 Q 65 65 80 55 L 80 35" fill="white" opacity="0.9"/>
    
    <!-- Tassel -->
    <line x1="50" y1="20" x2="50" y2="10" stroke="white" stroke-width="2"/>
    <circle cx="50" cy="8" r="3" fill="white"/>
  </g>
  
  <!-- "S" letter at bottom -->
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">S</text>
</svg>
